<!-- HEADER MINIMAL (título, auth y selector de idioma) -->
<header class="w-full flex justify-between items-center px-10 py-4 bg-slate-950/40 backdrop-blur-sm border-b border-blue-800/30">
  <h1 class="text-xl font-semibold text-yellow-400 tracking-wide">ADAF Tennis Simulator</h1>

  <div class="flex items-center gap-6">
    <!-- AUTH BUTTONS (cuando NO está logueado) -->
    <div id="auth-buttons-minimal" class="hidden items-center gap-3">
      <a href="/login" class="px-4 py-1.5 text-sm font-medium text-yellow-400 hover:text-yellow-300 transition">
        Iniciar Sesión
      </a>
      <a href="/registro" class="px-4 py-1.5 text-sm font-semibold bg-yellow-400 hover:bg-yellow-500 text-black rounded-full transition">
        Registrarse
      </a>
    </div>

    <!-- USER MENU (cuando SÍ está logueado) -->
    <div id="user-menu-minimal" class="hidden items-center gap-2 relative">
      <button id="user-menu-btn-minimal" class="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-800/50 transition">
        <div class="w-7 h-7 rounded-full bg-yellow-400/20 border border-yellow-400/40 flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span id="user-name-minimal" class="text-sm font-medium text-gray-200"></span>
      </button>
      
      <div id="user-dropdown-minimal" class="hidden absolute top-full right-0 mt-2 w-44 bg-slate-900 border border-blue-800/30 rounded-lg shadow-xl z-50">
        <a href="/perfil" class="block px-4 py-2 text-sm text-gray-200 hover:bg-slate-800 transition">Mi Perfil</a>
        <a href="/mis-jugadores" class="block px-4 py-2 text-sm text-gray-200 hover:bg-slate-800 transition">Mis Jugadores</a>
        <hr class="border-blue-800/30">
        <button onclick="logoutMinimal()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-slate-800 transition">Cerrar Sesión</button>
      </div>
    </div>
    <button id="lang-es" title="Versión en Español" class="cursor-pointer hover:scale-110 transition">
      <img src="/static/images/flag_es.png" alt="Español" class="w-8 h-8 rounded-full border-2 border-yellow-400 shadow-lg">
    </button>
    <button id="lang-en" title="English version" class="cursor-pointer hover:scale-110 transition">
      <img src="/static/images/flag_uk.png" alt="English" class="w-8 h-8 rounded-full border border-gray-400 shadow-sm">
    </button>
  </div>
</header>

<script>
(function() {
  const token = localStorage.getItem('access_token');
  const user = JSON.parse(localStorage.getItem('user') || 'null');
  
  const authButtons = document.getElementById('auth-buttons-minimal');
  const userMenu = document.getElementById('user-menu-minimal');
  
  if (token && user) {
    authButtons?.classList.add('hidden');
    userMenu?.classList.remove('hidden');
    userMenu?.classList.add('flex');
    
    const userName = document.getElementById('user-name-minimal');
    if (userName) userName.textContent = user.username || user.nombre;
    
    const menuBtn = document.getElementById('user-menu-btn-minimal');
    const dropdown = document.getElementById('user-dropdown-minimal');
    menuBtn?.addEventListener('click', () => dropdown?.classList.toggle('hidden'));
    
    document.addEventListener('click', (e) => {
      if (!userMenu?.contains(e.target)) dropdown?.classList.add('hidden');
    });
  } else {
    authButtons?.classList.remove('hidden');
    authButtons?.classList.add('flex');
    userMenu?.classList.add('hidden');
  }
})();

function logoutMinimal() {
  localStorage.removeItem('access_token');
  localStorage.removeItem('user');
  window.location.href = '/';
}
</script>
