<!-- HEADER HOME (con navegación y selector de idioma) -->
<header class="w-full flex justify-between items-center px-10 py-4 bg-slate-950/40 backdrop-blur-sm border-b border-blue-800/30">
  <!-- TÍTULO -->
  <div class="flex items-center space-x-3">
    <span class="text-xl font-semibold text-yellow-400 tracking-wide">
      ADAF Tennis Simulator
    </span>
  </div>

  <!-- NAV + AUTH + LANGUAGE SELECTOR -->
  <div class="flex items-center space-x-8">
    <!-- NAV -->
    <nav class="hidden md:flex space-x-8 text-sm">
      <a href="/documentacion" class="hover:text-yellow-400 transition" data-i18n="headerDocumentacion">Documentación del modelo</a>
      <a href="/creditos" class="hover:text-yellow-400 transition" data-i18n="headerCreditos">Créditos / Sobre el TFG</a>
    </nav>

    <!-- AUTH BUTTONS (cuando NO está logueado) -->
    <div id="auth-buttons" class="hidden items-center gap-3">
      <a href="/login" class="px-4 py-2 text-sm font-medium text-yellow-400 hover:text-yellow-300 transition">
        Iniciar Sesión
      </a>
      <a href="/registro" class="px-4 py-2 text-sm font-semibold bg-yellow-400 hover:bg-yellow-500 text-black rounded-full transition shadow-lg">
        Registrarse
      </a>
    </div>

    <!-- USER MENU (cuando SÍ está logueado) -->
    <div id="user-menu" class="hidden items-center gap-3 relative">
      <a href="/menu" class="px-4 py-2 text-sm font-semibold bg-yellow-400 hover:bg-yellow-500 text-black rounded-full transition shadow-lg">
        Ir al Menú
      </a>
      <button id="user-menu-btn" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800/50 transition">
        <div class="w-8 h-8 rounded-full bg-yellow-400/20 border border-yellow-400/40 flex items-center justify-center">
          <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <span id="user-name" class="text-sm font-medium text-gray-200"></span>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      
      <!-- Dropdown -->
      <div id="user-dropdown" class="hidden absolute top-full right-0 mt-2 w-48 bg-slate-900 border border-blue-800/30 rounded-lg shadow-xl z-50">
        <a href="/perfil" class="block px-4 py-2 text-sm text-gray-200 hover:bg-slate-800 transition">
          <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Mi Perfil
        </a>
        <hr class="border-blue-800/30">
        <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-slate-800 transition">
          <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Cerrar Sesión
        </button>
      </div>
    </div>

    <!-- LANGUAGE SELECTOR DISABLED (Solo español) -->
  </div>
</header>

<script>
// Verificar autenticación y mostrar botones apropiados
document.addEventListener('auth:ready', function(e) {
  const authButtons = document.getElementById('auth-buttons');
  const userMenu = document.getElementById('user-menu');
  
  if (e.detail.authenticated) {
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    // Mostrar menú de usuario
    authButtons?.classList.add('hidden');
    userMenu?.classList.remove('hidden');
    userMenu?.classList.add('flex');
    
    const userName = document.getElementById('user-name');
    if (userName) userName.textContent = user?.username || user?.nombre || '';
    
    // Toggle dropdown
    const menuBtn = document.getElementById('user-menu-btn');
    const dropdown = document.getElementById('user-dropdown');
    menuBtn?.addEventListener('click', () => {
      dropdown?.classList.toggle('hidden');
    });
    
    // Cerrar dropdown al hacer clic fuera
    document.addEventListener('click', (e) => {
      if (!userMenu?.contains(e.target)) {
        dropdown?.classList.add('hidden');
      }
    });
  } else {
    // Mostrar botones de login/registro
    authButtons?.classList.remove('hidden');
    authButtons?.classList.add('flex');
    userMenu?.classList.add('hidden');
  }
});

function logout() {
  localStorage.removeItem('access_token');
  localStorage.removeItem('user');
  window.location.href = '/';
}
</script>
