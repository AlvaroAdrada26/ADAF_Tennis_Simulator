<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ADAF Tennis Simulator{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/static/images/Logo_ADAF_SinLetras.png">
  <style>
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fade-up 1s ease-out forwards;
    }

    /* Sidebar transitions */
    .sidebar-expanded {
      transition: transform 0.3s ease-in-out;
    }
    .sidebar-hidden {
      transform: translateX(-100%);
    }
    .content-expanded {
      transition: margin-left 0.3s ease-in-out;
    }
    .content-collapsed {
      margin-left: 4rem;
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-b from-slate-900 via-blue-900 to-slate-800 relative text-gray-100 font-sans overflow-x-hidden {% block body_class %}{% endblock %}">

  <!-- CAPA DE IMAGEN DE PISTA -->
  <div class="absolute inset-0 bg-[url('/static/images/homepage_fondo2.jpg')] bg-cover bg-center opacity-15 blur-sm saturate-75 -z-20"></div>

  <!-- CAPA DE FONDO RADIAL SUAVE -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.05)_0%,_rgba(0,0,0,0)_70%)] -z-10"></div>

  <div class="flex min-h-screen w-full">

    <!-- SIDEBAR (partial reutilizable) -->
    {% block sidebar %}{% include "partials/sidebar.html" %}{% endblock %}

    <!-- CONTENIDO PRINCIPAL -->
    <div id="mainContent" class="content-expanded content-collapsed flex-1 flex flex-col {% block main_class %}{% endblock %}">

      <!-- HEADER -->
      {% block header %}{% endblock %}

      <!-- CONTENT -->
      {% block content %}{% endblock %}

      <!-- FOOTER -->
      {% block footer %}{% endblock %}

    </div>
    <!-- FIN CONTENIDO PRINCIPAL -->

  </div>
  <!-- FIN FLEX CONTAINER -->

  <!-- Menu Toggle Script -->
  {% block sidebar_script %}
  <script>
    const menuToggle = document.getElementById('menuToggle');
    const menuIcon = document.getElementById('menuIcon');
    const expandedSidebar = document.getElementById('expandedSidebar');
    const mainContent = document.getElementById('mainContent');
    let isMenuOpen = false;

    if (menuToggle) {
      menuToggle.addEventListener('click', () => {
        isMenuOpen = !isMenuOpen;
        
        if (isMenuOpen) {
          expandedSidebar.classList.remove('sidebar-hidden');
          mainContent.classList.remove('content-collapsed');
          mainContent.classList.add('ml-80');
          menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />';
        } else {
          expandedSidebar.classList.add('sidebar-hidden');
          mainContent.classList.add('content-collapsed');
          mainContent.classList.remove('ml-80');
          menuIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />';
        }
      });
    }
  </script>
  {% endblock %}

  <script src="/static/js/auth.js"></script>
  {% block scripts %}{% endblock %}

  <script src="/static/js/lang.js"></script>

</body>
</html>
