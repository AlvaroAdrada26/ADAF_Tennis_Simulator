<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ADAF Tennis Simulator{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/static/images/Logo_ADAF_SinLetras.png">
  <style>
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fade-up 1s ease-out forwards;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }
  </style>
  {% block head_extra %}{% endblock %}
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-b from-slate-900 via-blue-900 to-slate-800 relative text-gray-100 font-sans overflow-x-hidden">

  <!-- CAPA DE IMAGEN DE PISTA -->
  <div class="absolute inset-0 bg-[url('/static/images/homepage_fondo2.jpg')] bg-cover bg-center opacity-15 blur-sm saturate-75 -z-20"></div>

  <!-- CAPA DE FONDO RADIAL SUAVE -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.05)_0%,_rgba(0,0,0,0)_70%)] -z-10"></div>

  <!-- CONTENIDO (sin sidebar) -->
  <div class="flex-1 flex flex-col items-center justify-center px-4 py-8">
    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}
  <script src="/static/js/lang.js"></script>
</body>
</html>
